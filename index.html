<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Merger — Thenhatmedia</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0A0A0A;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  .card{background:#111;border:1px solid #1F1F1F;border-radius:12px;padding:40px;width:100%;max-width:520px}
  h1{font-size:22px;font-weight:300;letter-spacing:.06em;margin-bottom:6px;color:#fff}
  .sub{font-size:13px;color:#555;margin-bottom:32px}
  .label{font-size:11px;color:#555;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;margin-top:20px}
  .label:first-of-type{margin-top:0}
  input{width:100%;background:#0A0A0A;border:1px solid #1F1F1F;border-radius:6px;padding:11px 14px;color:#fff;font-size:13px;outline:none;transition:border-color .15s}
  input:focus{border-color:#444}
  input::placeholder{color:#333}
  .add-btn{width:100%;margin-top:10px;padding:9px;background:transparent;border:1px dashed #1F1F1F;border-radius:6px;color:#444;font-size:13px;cursor:pointer;transition:all .15s}
  .add-btn:hover{border-color:#333;color:#666}
  .merge-btn{width:100%;margin-top:28px;padding:13px;background:#fff;color:#000;border:none;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;transition:opacity .15s;letter-spacing:.02em}
  .merge-btn:hover{opacity:.88}
  .merge-btn:disabled{opacity:.3;cursor:not-allowed}
  .status{margin-top:18px;padding:12px 16px;border-radius:6px;font-size:13px;display:none}
  .status.loading{display:flex;align-items:center;gap:10px;background:#111;border:1px solid #1F1F1F;color:#888}
  .status.error{display:block;background:rgba(255,68,68,.08);border:1px solid rgba(255,68,68,.2);color:#FF4444}
  .status.success{display:block;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:#22C55E}
  .spinner{width:16px;height:16px;border:2px solid #1F1F1F;border-top-color:#555;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .input-row{position:relative}
  .remove-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#333;cursor:pointer;font-size:16px;line-height:1;padding:4px;transition:color .15s}
  .remove-btn:hover{color:#FF4444}
  .badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid #1F1F1F;color:#555;margin-left:8px;vertical-align:middle;letter-spacing:.04em}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="card">
  <h1>Video Merger <span class="badge">Beta</span></h1>
  <div class="sub">Dán link Facebook hoặc TikTok — tự động tải và ghép nối đuôi</div>

  <div class="label">Link video (tối đa 3)</div>
  <div id="inputs">
    <div class="input-row">
      <input type="url" placeholder="https://www.facebook.com/reel/..." />
    </div>
    <div class="input-row" style="margin-top:8px">
      <input type="url" placeholder="https://www.tiktok.com/@..." />
      <button class="remove-btn" onclick="removeInput(this)">×</button>
    </div>
  </div>

  <button class="add-btn" id="add-btn" onclick="addInput()">+ Thêm link</button>

  <button class="merge-btn" id="merge-btn" onclick="startMerge()">Tải & Ghép video</button>

  <div class="status loading" id="status-loading">
    <div class="spinner"></div>
    <span id="status-text">Đang tải video...</span>
  </div>
  <div class="status error" id="status-error"></div>
  <div class="status success" id="status-success">✓ Ghép xong! File đang được tải về.</div>
</div>

<script>
function addInput() {
  const container = document.getElementById('inputs');
  const rows = container.querySelectorAll('.input-row');
  if (rows.length >= 3) return;
  const div = document.createElement('div');
  div.className = 'input-row';
  div.style.marginTop = '8px';
  div.innerHTML = `<input type="url" placeholder="https://..." /><button class="remove-btn" onclick="removeInput(this)">×</button>`;
  container.appendChild(div);
  if (rows.length + 1 >= 3) document.getElementById('add-btn').style.display = 'none';
  div.querySelector('input').focus();
}

function removeInput(btn) {
  btn.closest('.input-row').remove();
  document.getElementById('add-btn').style.display = '';
}

async function startMerge() {
  const inputs = document.querySelectorAll('#inputs input');
  const urls = [...inputs].map(i => i.value.trim()).filter(Boolean);

  if (!urls.length) return alert('Bạn chưa nhập link nào');

  setLoading(true);

  const steps = urls.length === 1
    ? ['Đang tải video...', 'Đang xử lý...']
    : ['Đang tải video...', 'Đang ghép video...', 'Đang ghép video...'];

  let step = 0;
  const stepInterval = setInterval(() => {
    step = Math.min(step + 1, steps.length - 1);
    document.getElementById('status-text').textContent = steps[step];
  }, 15000);

  try {
    const res = await fetch('/merge', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ urls }),
      signal: AbortSignal.timeout(300000)
    });

    clearInterval(stepInterval);

    if (!res.ok) {
      const { error } = await res.json().catch(() => ({ error: 'Server mất kết nối — video quá dài hoặc server đang bận, hãy thử lại.' }));
      throw new Error(error);
    }

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'merged.mp4';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    setStatus('success');
  } catch (err) {
    clearInterval(stepInterval);
    setStatus('error', err.name === 'TimeoutError' ? 'Quá thời gian chờ (5 phút). Thử lại với video ngắn hơn.' : err.message);
  } finally {
    setLoading(false);
  }
}

function setLoading(on) {
  document.getElementById('merge-btn').disabled = on;
  document.getElementById('status-loading').className = 'status' + (on ? ' loading' : '');
  if (on) {
    document.getElementById('status-error').className = 'status';
    document.getElementById('status-success').className = 'status';
    document.getElementById('status-text').textContent = 'Đang tải video...';
  }
}

function setStatus(type, msg) {
  if (type === 'error') {
    const el = document.getElementById('status-error');
    el.className = 'status error';
    el.textContent = '✕ ' + msg;
  } else {
    document.getElementById('status-success').className = 'status success';
  }
}
</script>
</body>
</html>
